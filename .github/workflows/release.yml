name: Release

on:
  release:
    types: [published]

env:
  node_version: 24

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set manifest version and links from the release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "src/module.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.TAG_NAME.replace(/^v/, "");
            manifest.url = `https://github.com/${process.env.REPO}`;
            manifest.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/module.json`;
            manifest.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG_NAME}/module.zip`;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Build
        run: npm run build

      - name: Create module.zip
        working-directory: ./dist
        run: zip -r ../module.zip .

      - name: Upload release assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "dist/module.json,module.zip"
          body: ${{ toJSON(github.event.release.body) }}
